name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-test-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-test-

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  conformance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-conformance-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-conformance-

      - name: Checkout parent (fixtures + runner)
        uses: actions/checkout@v4
        with:
          repository: OrzMC/OrzMC
          path: parent

      - name: Build adapter
        run: swift build -c debug --product ConformanceAdapter

      - name: Run conformance suite
        run: |
          BIN="$(swift build -c debug --show-bin-path)/ConformanceAdapter"
          python3 parent/scripts/conformance/run.py --adapter "$BIN" --strict

      - name: Build CLI
        run: swift build -c debug --product orzmc

      # 命令面单一化（规范 §8.3）：用真实 `capabilities` 与父仓库 manifest 对比，
      # 未声明漂移即失败（两侧已 0 漂移）。
      - name: CLI surface check (strict)
        run: |
          BIN="$(swift build -c debug --show-bin-path)"
          "$BIN/orzmc" --json capabilities > "$RUNNER_TEMP/caps.json"
          python3 parent/scripts/verify/surface.py \
            --implementation swift \
            --capabilities "$RUNNER_TEMP/caps.json" \
            --strict
