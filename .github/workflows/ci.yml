name: CI

on:
  push:
    branches: [main]
    # 纯文档/CHANGELOG 提交不必跑 6 个 job（实测：main 上每次 push 平均 5 分钟，
    # Windows job 13 分钟）。代码变更照常跑。
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    # release-please 的分支只改版本号与 CHANGELOG，跑满 CI 纯浪费
    # （2026-10-18 实测：一天 11 次）。
    branches-ignore:
      - "release-please--**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 只用标准 GitHub-hosted runner；勿改 `-large`/`-xlarge`（larger runner，即使 public 也计费）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 缓存只在 main 落盘（PR 只 restore）：GitHub 缓存按分支计费，10GiB/仓，
      # 若每个分支都存一份会互相驱逐。key 与 conformance 共用（同为 debug）。
      - name: Restore SwiftPM cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-debug-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-debug-

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Save SwiftPM cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # 平台下限 + Intel 编译门禁(父仓库 docs/platform-support.md):
  # 逻辑层(本 CLI + 库)**钉在 macOS 13**,且发布/分发路径要能跑在 Intel 上。
  # 两件事都做:① 产物 minos 必须 ≤ 13(谁把 platforms 抬到 14 就红);
  #            ② x86_64 交叉编译(抓 arm64-only 写法;插件是 x86_64 可执行文件,所以要先装 Rosetta)。
  platform:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Ensure Rosetta 2
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 已安装"
          else
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Declared macOS floor must be 13
        run: |
          set -euo pipefail
          floor="$(grep -oE '\.macOS\(\.v[0-9_]+\)' Package.swift | head -1 | grep -oE '[0-9_]+')"
          echo "声明下限: macOS ${floor//_/.}"
          [ "$floor" = "13" ] || {
            echo "::error::逻辑层必须钉 macOS 13(卡在 Ventura 的 Intel Mac 靠 CLI);" \
                 "改这里要同步父仓库 docs/platform-support.md"
            exit 1
          }

      - name: Build CLI (native) and check minos
        run: |
          set -euo pipefail
          swift build --product orzmc --only-use-versions-from-resolved-file
          BIN="$(swift build --show-bin-path --product orzmc)/orzmc"
          minos="$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
          echo "orzmc minos = $minos"
          case "$minos" in
            1[0-3].*) ;;
            *) echo "::error::orzmc 的 minos 被抬到 13 以上($minos)" ; exit 1 ;;
          esac

      - name: Build CLI for Intel (x86_64)
        run: |
          set -euo pipefail
          swift build --product orzmc --arch x86_64 --only-use-versions-from-resolved-file
          BIN="$(swift build --show-bin-path --arch x86_64 --product orzmc)/orzmc"
          archs="$(lipo -archs "$BIN")"
          echo "x86_64 产物架构 = $archs"
          case "$archs" in
            *x86_64*) ;;
            *) echo "::error::Intel 切片缺失($archs)"; exit 1 ;;
          esac

  # 能力台账校验(两套 CLI 并行期,见父仓库 docs/two-cli-strategy.md):
  # 用**本实现的 capabilities 输出**反向验证 docs/spec/parity.json 里声明的状态
  # (标 parity 必须真有该命令,标 na 不许有),防止「台账写得好、实现悄悄漂移」。
  ledger:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout parent (spec + ledger)
        uses: actions/checkout@v4
        with:
          repository: OrzMC/OrzMC
          path: parent
          sparse-checkout: |
            docs/spec
            scripts/verify
            scripts/accept
      - name: Build (orzmc)
        run: swift build --only-use-versions-from-resolved-file
      - name: Verify ledger against capabilities
        run: |
          set -euo pipefail
          BIN="$(swift build --show-bin-path)"
          "$BIN/orzmc" --json capabilities > /tmp/caps.json
          python3 parent/scripts/verify/parity.py --swift-caps /tmp/caps.json

  # 秒级反馈通道:跨平台静态检查。跑在 runner 宿主机上(ubuntu-latest 自带 python3),
  # 不用容器、不装依赖,~10 秒出结论——把「Apple-only 写法」挡在 2 分钟的构建之前。
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Portability lint
        run: python3 scripts/verify/portability.py

  # Linux 构建与验收(决策 D14:Swift CLI 收敛为唯一跨平台实现)。
  # 用官方 `swift:6.0` 容器与 `// swift-tools-version:6.0` 对齐;与 macOS job 同门禁:
  # 编译 + 单测 + CLI 行为验收(父仓库 `scripts/accept/cli.py`,真实进程)。
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 验收脚本只有一份，在父仓库（M2）。
      - name: Checkout parent (acceptance harness + spec)
        uses: actions/checkout@v4
        with:
          repository: OrzMC/OrzMC
          path: parent
          sparse-checkout: |
            docs/spec
            scripts/accept

      - name: Runtime tools
        # `zip` 是备份功能的运行时依赖(极简镜像不自带);`python3` 供验收脚本使用。
        run: |
          apt-get update -qq
          apt-get install -y -qq zip python3 >/dev/null

      # SwiftPM 冷构建在容器里约 2–3 分钟（约 300–960 步），缓存后只编译本仓改动。
      - name: Restore SwiftPM cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            /root/.cache/org.swift.swiftpm
          key: spm-${{ runner.os }}-linux-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-linux-

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: CLI acceptance
        # 容器里的默认 shell 是 `sh`（不支持 `set -o pipefail`），显式用 bash。
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --product orzmc
          python3 parent/scripts/accept/cli.py --cli .build/release/orzmc \
            --state-paths parent/docs/spec/state-paths.json

      - name: Save SwiftPM cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            /root/.cache/org.swift.swiftpm
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Windows 构建与冒烟(D14 Phase 6.5 / docs/windows-port.md)。
  # **只在 main 与手动触发时跑**:一次 8–11 分钟,挂在每个 PR 上会拖慢反馈;
  # 平台缺口由本 job 与 `linux`/macOS 三件套共同兜住。
  #
  # 三条硬前提(每一条都被实测证实,缺一必挂):
  #   1. `windows-2022`(windows-2025 的 VS18 STL 要求 Clang 20+,当前工具链不满足);
  #   2. Swift **6.2**(6.0 的 SwiftPM 在 Windows 上处理构建插件输出有缺陷);
  #   3. `update-sdk-modules: true` + 开发者模式(SwiftPM 需要建符号链接)。
  windows:
    # 只在 main 与手动触发时跑（一次 13 分钟），且**只在源码/依赖/工作流变更时**跑：
    # 指针 bump、文档提交不触发（实测一天 15 次 main push 里多数与源码无关）。
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect source changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only HEAD~1 HEAD -- Sources Package.swift Package.resolved .github/workflows | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "无源码变更，跳过 Windows 构建（省 ~13 分钟）"
          fi

      - name: Install Swift
        if: steps.changes.outputs.run == 'true'
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
          update-sdk-modules: true

      - name: Enable Developer Mode (symlinks for build-tool plugins)
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            -Name AllowDevelopmentWithoutDevLicense -PropertyType DWORD -Value 1 -Force | Out-Null

      - name: Toolchain
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        run: swift --version

      - name: Build (orzmc)
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        run: |
          swift build --product orzmc --only-use-versions-from-resolved-file 2>&1 |
            Tee-Object -FilePath build.log

      - name: Smoke (runtime, 干净 PATH)
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        run: |
          # 产物 = exe + 运行时 DLL（见 release.yml 的打包说明）：先按发布形态放好，再清 PATH 验证。
          $bin = ".build\x86_64-unknown-windows-msvc\debug\orzmc.exe"
          $runtime = (Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Runtimes\*\usr\bin" -Directory | Select-Object -Last 1).FullName
          New-Item -ItemType Directory -Force shipped | Out-Null
          Copy-Item $bin shipped\
          Copy-Item "$runtime\*.dll" shipped\
          $exe = ".\shipped\orzmc.exe"
          # 模拟「用户机器没装 Swift」：从 PATH 里摘掉所有 Swift 目录后再跑。
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and $_ -notmatch 'Swift' }) -join ';'
          & $exe --version | Select-Object -First 1
          $caps = & $exe --json capabilities | ConvertFrom-Json
          if ($caps.ok -ne $true) { throw "capabilities 信封不对" }
          if (($caps.data.commands | Measure-Object).Count -lt 13) { throw "capabilities 命令不足" }
          $list = & $exe --json list | ConvertFrom-Json
          if ($list.ok -ne $true) { throw "list 信封不对" }
          # 规范 §4.5:补全脚本命令名必须是 orzmc(曾渲染成完整 .exe 路径)
          $completion = (& $exe completion bash) -join "`n"
          if ($completion -notmatch "function _orzmc\(\)") { throw "补全函数名不是 _orzmc" }
          Write-Output "ok: smoke passed"

      # 单测在 Windows 上已是硬门禁(2026-10-18 起:98 tests 全过;
      # 之前 `defaultRoot()` 断言写死了 `/minecraft`,已按平台修正)。
      - name: Test
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        run: swift test 2>&1 | Tee-Object -FilePath test.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore

  # Windows **arm64** 探针：只在手动触发时跑（零常态成本）。
  # 用途：在合并 workflow 改动**之前**先确认「`windows-11-arm` runner + Swift arm64 工具链 +
  # 构建 + 单测」这条链路真通（验证驱动的纪律：不猜）。
  #   gh workflow run ci.yml --ref <branch>
  # 正式发布的权威门禁仍是 `release.yml` 的 `build-windows`（x64 + arm64 两腿，见 docs/windows-port.md）。
  windows-arm64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift (arm64)
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
          # arm64 必须显式指定：默认 amd64，会装上 x64 工具链而在 arm64 上跑不起来
          build_arch: arm64
          update-sdk-modules: true

      - name: Enable Developer Mode (symlinks for build-tool plugins)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            -Name AllowDevelopmentWithoutDevLicense -PropertyType DWORD -Value 1 -Force | Out-Null

      # runner 默认给的是 x64 的 MSVC 库；不换 arm64 会报
      # `msvcrt.lib(...): machine type x64 conflicts with arm64`（2026-10-19 探针实测）。
      - name: MSVC environment (arm64)
        uses: ./.github/actions/msvc-arm64

      - name: Toolchain
        shell: pwsh
        run: |
          swift --version
          Write-Output "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Output "LIB=$env:LIB"

      - name: Build (orzmc)
        shell: pwsh
        run: |
          swift build --product orzmc --only-use-versions-from-resolved-file 2>&1 |
            Tee-Object -FilePath build.log

      - name: Smoke (runtime, 干净 PATH)
        shell: pwsh
        run: |
          # 与 `windows` job 同一套断言；bin 路径改用 `--show-bin-path`（不写死目标三元组）。
          $bin = Join-Path (swift build --show-bin-path) "orzmc.exe"
          $runtime = (Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Runtimes\*\usr\bin" -Directory | Select-Object -Last 1).FullName
          New-Item -ItemType Directory -Force shipped | Out-Null
          Copy-Item $bin shipped\
          Copy-Item "$runtime\*.dll" shipped\
          $exe = ".\shipped\orzmc.exe"
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and $_ -notmatch 'Swift' }) -join ';'
          & $exe --version | Select-Object -First 1
          $caps = & $exe --json capabilities | ConvertFrom-Json
          if ($caps.ok -ne $true) { throw "capabilities 信封不对" }
          if (($caps.data.commands | Measure-Object).Count -lt 13) { throw "capabilities 命令不足" }
          $completion = (& $exe completion bash) -join "`n"
          if ($completion -notmatch "function _orzmc\(\)") { throw "补全函数名不是 _orzmc" }
          Write-Output "ok: arm64 smoke passed"

      - name: Test
        shell: pwsh
        run: swift test 2>&1 | Tee-Object -FilePath test.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore

  # CLI 行为验收(父仓库 `docs/spec/conformance.md` §12):帮助 / 信封 / 退出码 /
  # 取消语义 / 补全落点 / MCP,全部走**真实进程**。与 Python 侧
  # 与 Python 侧跑的是**同一份**父仓库脚本 `scripts/accept/cli.py`(M2)。
  # 单测跑不到的东西(进程退出码、非 TTY、真实文件落点)由它兜住。
  cli-acceptance:
    # 只用标准 GitHub-hosted runner；勿改 `-large`/`-xlarge`（larger runner，即使 public 也计费）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 验收脚本只有一份，在父仓库（`docs/two-cli-strategy.md` M2）。
      - name: Checkout parent (acceptance harness + spec)
        uses: actions/checkout@v4
        with:
          repository: OrzMC/OrzMC
          path: parent
          sparse-checkout: |
            docs/spec
            scripts/accept

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-debug-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-debug-

      - name: Build orzmc
        run: swift build -c debug --product orzmc

      - name: CLI acceptance
        run: python3 parent/scripts/accept/cli.py --cli .build/debug/orzmc --state-paths parent/docs/spec/state-paths.json

  conformance:
    # 只用标准 GitHub-hosted runner；勿改 `-large`/`-xlarge`（larger runner，即使 public 也计费）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 只 restore：共享 test job 写盘的同一份 debug 缓存，避免两份 3GiB。
      - name: Restore SwiftPM cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-debug-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-debug-

      - name: Checkout parent (fixtures + runner)
        uses: actions/checkout@v4
        with:
          repository: OrzMC/OrzMC
          path: parent

      - name: Build adapter
        run: swift build -c debug --product ConformanceAdapter

      - name: Run conformance suite
        run: |
          BIN="$(swift build -c debug --show-bin-path)/ConformanceAdapter"
          python3 parent/scripts/conformance/run.py --adapter "$BIN" --strict

      - name: Build CLI
        run: swift build -c debug --product orzmc

      # 命令面单一化（规范 §8.3）：用真实 `capabilities` 与父仓库 manifest 对比，
      # 未声明漂移即失败（两侧已 0 漂移）。
      - name: CLI surface check (strict)
        run: |
          BIN="$(swift build -c debug --show-bin-path)"
          "$BIN/orzmc" --json capabilities > "$RUNNER_TEMP/caps.json"
          python3 parent/scripts/verify/surface.py \
            --implementation swift \
            --capabilities "$RUNNER_TEMP/caps.json" \
            --strict
