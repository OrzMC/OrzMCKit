name: Release Please

# 人只管写 Conventional Commits;机器人维护一个 release PR(自动 bump 版本 +
# 生成 CHANGELOG.md)。合并该 PR = 按下发版按钮 → 自动打 tag + 建 release →
# 触发 release.yml 构建 macOS 二进制并发布。
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # 接力 dispatch release.yml(GITHUB_TOKEN 建的 tag 不会触发工作流)

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 接力步骤要读 .release-please-manifest.json(release-please action 自己不 checkout)。
      - uses: actions/checkout@v4
      - name: Create the release tag before release-please runs
        # 顺序很关键:tag 必须在 release-please 之前存在。release-please 以「tag 里的版本 =
        # 已发布版本」做 bookkeeping,而草稿 release **不会**创建 git tag(GitHub 只在发布时
        # 建 ref)——否则 release-please 会当成「从未发过版」从头扫历史,开出一个塞满历史提交的
        # 假 release PR。这里先按 HEAD 建 tag,它随后看到的 bookkeeping 状态就是一致的。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')"
          tag="v${version}"
          # 只在「HEAD 就是发布提交」时建:manifest 版本与代码里的版本号一致。
          head_version="$(sed -n 's/.*static let current = "\([^"]*\)".*/\1/p' Sources/Game/OrzMCVersion.swift | head -1)"
          if [ "${head_version}" != "${version}" ]; then
            echo "HEAD 版本(${head_version})≠ manifest(${version})—— 不是发布提交,不建 tag"
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} 已存在 —— bookkeeping 一致,无需处理"
            exit 0
          fi
          sha="$(git rev-parse HEAD)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}" >/dev/null
          echo "已按 HEAD 创建 tag ${tag} → ${sha}(避免 release-please 误判为从未发版)"
      # RELEASE_PLEASE_TOKEN 是可选优化:用 PAT 建的 release PR 才会触发 CI
      # (GITHUB_TOKEN 建的 PR 按设计不触发工作流)。没有它也能用。
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # GITHUB_TOKEN 建的 tag/release 不会触发新的工作流运行(递归保护),所以
      # release.yml 的 `push: tags` 不会自己响 —— 必须显式接力。判据是「tag 存在但
      # 缺产物」,幂等且自愈。
      - name: Kick off the release pipeline when the tag has no binaries yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
          tag="v${version}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "no tag ${tag} yet — nothing to release"
            exit 0
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'orzmc-macos-arm64'; then
            echo "${tag} already carries binaries — nothing to do"
            exit 0
          fi
          echo "tag ${tag} exists without binaries — dispatching the release pipeline"
          gh workflow run release.yml --ref "${{ github.event.repository.default_branch }}" -f tag="$tag"
