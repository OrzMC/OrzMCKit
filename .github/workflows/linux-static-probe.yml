name: Linux static probe

# 一次性探针（手动触发）：确认「Linux 资产能否自包含」。
#
# 背景（`docs/cli-comparison.md` §3/§6.1）：`orzmc-linux-*` 现在动态依赖
# `libswiftCore.so` / `libFoundation*.so` / `libdispatch.so`，且 glibc 下限跟随构建机
# （ubuntu-24.04 → GLIBC_2.38），干净 Linux 上直接跑不起来。
#
# 探针要回答两个问题：
#   1. `--static-swift-stdlib` 在 Linux 上能否把 Swift 运行时链进去（含 Foundation）？
#   2. 把构建机换成 `swift:6.0-jammy`（Ubuntu 22.04，glibc 2.35）能否降低 glibc 下限？
#
# 输出：每个组合的 `ldd` 结果 + 最高 GLIBC 符号 + 能否在本机执行。
# 结论确定后**删除本文件**（只在 §6.1 修完之前的窗口里需要）。
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: swift:6.0-jammy
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Base image facts
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          . /etc/os-release
          echo "image: $PRETTY_NAME"
          ldd --version | head -1

      - name: Build (dynamic Swift stdlib)
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --product orzmc --only-use-versions-from-resolved-file
          BIN="$(swift build -c release --show-bin-path)/orzmc"
          cp "$BIN" "/tmp/orzmc-${{ matrix.arch }}-dynamic"

      - name: Build (--static-swift-stdlib)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build/release
          swift build -c release --product orzmc --static-swift-stdlib --only-use-versions-from-resolved-file
          BIN="$(swift build -c release --show-bin-path)/orzmc"
          cp "$BIN" "/tmp/orzmc-${{ matrix.arch }}-static"

      - name: Report dependencies + glibc floor
        shell: bash
        run: |
          set -euo pipefail
          for variant in dynamic static; do
            bin="/tmp/orzmc-${{ matrix.arch }}-${variant}"
            echo "===== ${variant} ====="
            echo "size: $(du -h "$bin" | cut -f1)"
            echo "--- ldd ---"
            ldd "$bin" || true
            echo "--- 残留 libswift* / libFoundation* ---"
            if ldd "$bin" 2>/dev/null | grep -E 'libswift|libFoundation|libdispatch|libBlocksRuntime'; then
              echo "RESULT ${variant}: NOT self-contained"
            else
              echo "RESULT ${variant}: self-contained (no swift runtime deps)"
            fi
            echo "--- glibc floor ---"
            strings -a "$bin" | grep -oE 'GLIBC_2\.[0-9]+' | sort -V -u | tail -1
            echo "--- runs? ---"
            "$bin" --version | head -1 || echo "RESULT ${variant}: FAILED TO RUN"
          done

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Linux probe (${{ matrix.arch }}, swift:6.0-jammy)"
            echo '```'
            for variant in dynamic static; do
              bin="/tmp/orzmc-${{ matrix.arch }}-${variant}"
              echo "[$variant] size=$(du -h "$bin" | cut -f1) glibc=$(strings -a "$bin" | grep -oE 'GLIBC_2\.[0-9]+' | sort -V -u | tail -1)"
              ldd "$bin" 2>/dev/null | grep -E 'libswift|libFoundation|libdispatch|libBlocksRuntime' | sed 's/^/    still-needs: /' || echo "    needs: (no swift runtime)"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
