name: Release

# 发布 Swift `orzmc` CLI（macOS + Linux + Windows）：tag `vX.Y.Z` → 构建各平台二进制 →
# 校验自报版本 → 挂到 GitHub Release（全部产物到位后才可见）。
#
# 资产命名与 Python 侧 `asset_for()` 一致：`orzmc-macos-<arch>`，便于 `orzmc update`
# 用同一套 (os, arch) → asset 规则解析（见 docs/spec/install-update.md §6）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag(如 v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 第一道护栏：tag 必须等于代码里的 OrzMCVersion.current，且落在 main 上。
  # 不一致的代价：客户端自升级用 releases/latest 的 tag 与二进制内嵌版本比较，
  # 版本对不上会变成「下载→替换→重启后版本没变→再提示升级」的死循环。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Read the version from source
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*static let current = "\([^"]*\)".*/\1/p' Sources/Game/OrzMCVersion.swift | head -1)"
          if [ -z "$version" ]; then
            echo "::error::cannot read OrzMCVersion.current from Sources/Game/OrzMCVersion.swift"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag matches the version in source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match v$VERSION (Sources/Game/OrzMCVersion.swift). Bump the version first, then tag."
            exit 1
          fi
          echo "ok: $TAG == v$VERSION"
      - name: Tag commit is on main
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 用 checkout 出来的 HEAD(手动 dispatch 时 github.ref 是分支,不能当 tag)。
          sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "::error::tag $TAG points at $sha which is not on main — release from main only."
            exit 1
          fi
          echo "ok: $sha is on main"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset: orzmc-macos-arm64
          # 交叉编译（`swift build --arch x86_64`）被 swift-openapi-generator 构建插件挡下：
          # 插件内部按 `ARCHS` 校验、`VALID_ARCHS` 仅 arm64 → 失败（实测 air）。
          # 故 x86_64 仍用 Intel runner；靠 SwiftPM 缓存把二次构建从 ~58min 拉低。
          - runner: macos-15-intel
            arch: x86_64
            asset: orzmc-macos-x86_64
    runs-on: ${{ matrix.runner }}
    # 只用标准 GitHub-hosted runner（`macos-15`/`macos-15-intel`）；
    # 勿改 `-large`/`-xlarge`（larger runner，即使 public 也计费）。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Toolchain
        run: swift --version
      - name: Restore SwiftPM cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-release-${{ matrix.asset }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-release-${{ matrix.asset }}-
      - name: Build (release)
        run: swift build -c release --product orzmc
      - name: Package the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --show-bin-path)"
          cp "$BIN/orzmc" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" version
      - name: Save SwiftPM cache
        # release 由 workflow_dispatch 在 main 上触发 → ref 为 main，可复用。
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Assert architecture
        shell: bash
        run: |
          set -euo pipefail
          info="$(file -b "${{ matrix.asset }}")"
          echo "$info"
          case "$info" in
            *"${{ matrix.arch }}"*) echo "ok: ${{ matrix.arch }}" ;;
            *) echo "::error::expected ${{ matrix.arch }}, got: $info"; exit 1 ;;
          esac
      - name: Assert the binary reports the released version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          out="$(./${{ matrix.asset }} version)"
          case "$out" in
            "orzmc ${TAG#v}"*) echo "ok: $out" ;;
            *) echo "::error::binary reports '$out', expected 'orzmc ${TAG#v}'"; exit 1 ;;
          esac
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # Linux 产物（决策 D14：跨平台）。用官方 `swift:6.0` 容器构建，资产命名与
  # Python 侧 `asset_for()` 的 (os, arch) → asset 规则一致（`orzmc-linux-<arch>`）。
  build-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            file_arch: x86-64
            asset: orzmc-linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            file_arch: aarch64
            asset: orzmc-linux-arm64
    runs-on: ${{ matrix.runner }}
    container: swift:6.0
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        run: swift build -c release --product orzmc
      - name: Package the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --show-bin-path)"
          cp "$BIN/orzmc" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" version
      - name: Assert architecture
        shell: bash
        run: |
          set -euo pipefail
          # `swift:6.0` 精简镜像没有 `file`；容器里用 `uname -m` 断言「构建机架构」，
          # 再靠下面的 `./asset version` 证明产物能在本机执行（架构不符会直接 Exec format error）。
          machine="$(uname -m)"
          echo "runner arch: $machine (expect ${{ matrix.file_arch }})"
          case "$machine" in
            "${{ matrix.file_arch }}"|"${{ matrix.arch }}") echo "ok: ${{ matrix.arch }}" ;;
            *) echo "::error::expected ${{ matrix.arch }}, got runner $machine"; exit 1 ;;
          esac
      - name: Assert the binary reports the released version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          out="$(./${{ matrix.asset }} version)"
          case "$out" in
            "orzmc ${TAG#v}"*) echo "ok: $out" ;;
            *) echo "::error::binary reports '$out', expected 'orzmc ${TAG#v}'"; exit 1 ;;
          esac
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # Windows 产物（D14 Phase 6.5）。前提同 `ci.yml` 的 `windows` job：
  # `windows-2022` + Swift 6.2 + `update-sdk-modules` + 开发者模式（详见 docs/windows-port.md）。
  build-windows:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            asset: orzmc-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
          update-sdk-modules: true
      - name: Enable Developer Mode (symlinks for build-tool plugins)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            -Name AllowDevelopmentWithoutDevLicense -PropertyType DWORD -Value 1 -Force | Out-Null
      - name: Build (release)
        shell: pwsh
        run: |
          # 静态链接 Swift 运行时：用户机器通常没装 Swift，动态链接会 STATUS_DLL_NOT_FOUND。
          swift build -c release --product orzmc --static-swift-stdlib --only-use-versions-from-resolved-file
      - name: Package the binary
        shell: pwsh
        run: |
          $bin = (swift build -c release --show-bin-path)
          Copy-Item "$bin\orzmc.exe" "${{ matrix.asset }}"
          # 用「没有 Swift 的 PATH」验证产物自包含（真机曾出现 0xC0000135 = DLL 找不到）。
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and $_ -notmatch 'Swift' }) -join ';'
          & ".\${{ matrix.asset }}" --version | Select-Object -First 1
      - name: Assert the binary reports the released version
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $out = (& ".\${{ matrix.asset }}" --version | Select-Object -First 1)
          $want = "orzmc $($env:TAG.TrimStart('v'))"
          if (-not $out.StartsWith($want)) { throw "binary reports '$out', expected '$want'" }
          Write-Output "ok: $out"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: orzmc-windows-x86_64
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # 所有平台产物齐了才建/发布 Release：半成品不会出现在 releases/latest 上，
  # 一键安装与 `orzmc update` 也就不会提前把新版本推给用户。
  # 发布后验收（D14.1 第 1/4 条）：把**用户真正下载到的** Linux 资产拉下来，
  # 在干净容器里跑 CLI 行为验收 + 安装器全链路（安装 → 补全落盘 → 清单 → 卸载清理）。
  # 资产坏了这一步就红，而不是等用户踩。
  verify-linux:
    needs: publish
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tooling
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates python3 zip >/dev/null

      - name: Download the published asset
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p dist
          curl -fsSL -o dist/orzmc-linux-x86_64 "${base}/orzmc-linux-x86_64"
          curl -fsSL -o dist/SHA256SUMS "${base}/SHA256SUMS"
          cd dist && sha256sum -c --ignore-missing SHA256SUMS

      - name: CLI acceptance on the released binary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/orzmc-linux-x86_64
          python3 scripts/accept_cli.py --cli dist/orzmc-linux-x86_64

      - name: Installer end-to-end (install → verify → uninstall)
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export ORZMC_VERSION="$TAG"
          export SHELL=/bin/bash

          sh scripts/install.sh

          bin="$HOME/.local/bin/orzmc"
          completion="$HOME/.local/share/bash-completion/completions/orzmc"
          manifest="$HOME/.local/state/orzmc/install.conf"

          test -x "$bin" || { echo "::error::未安装二进制"; exit 1; }
          "$bin" --version | grep -q "orzmc ${TAG#v}" || { echo "::error::版本不符"; exit 1; }
          test -f "$completion" || { echo "::error::补全未落盘"; exit 1; }
          grep -q "^platform=linux-x86_64$" "$manifest" || { echo "::error::install.conf platform 不对"; cat "$manifest"; exit 1; }
          grep -q "^completion_file=" "$manifest" || { echo "::error::install.conf 未登记 completion_file"; cat "$manifest"; exit 1; }

          "$bin" uninstall --yes
          test ! -e "$bin" || { echo "::error::卸载后二进制仍在"; exit 1; }
          test ! -e "$completion" || { echo "::error::卸载后补全仍在"; exit 1; }
          echo "ok: install → verify → uninstall 全链路通过"

  publish:
    needs: [build, build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum orzmc-macos-* orzmc-linux-* orzmc-windows-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # release-please 可能已建好 draft release(带整理过的 notes):补产物后发布。
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
          gh release view "$TAG" --json tagName,isDraft,url \
            --jq '"released \(.tagName) draft=\(.isDraft) \(.url)"'
