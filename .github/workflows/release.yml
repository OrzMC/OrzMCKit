name: Release

# 发布 Swift `orzmc` CLI（macOS + Linux + Windows）：tag `vX.Y.Z` → 构建各平台二进制 →
# 校验自报版本 → 挂到 GitHub Release（全部产物到位后才可见）。
#
# 资产命名与 Python 侧 `asset_for()` 一致：`orzmc-macos-<arch>`，便于 `orzmc update`
# 用同一套 (os, arch) → asset 规则解析（见 docs/spec/install-update.md §6）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        # dry-run 时可不填（用源码版本拼 tag）；正式发布仍必须填，否则 verify 会报错。
        description: "要发布的 tag(如 v0.1.0)；dry-run 可留空"
        required: false
        type: string
      dry-run:
        # 实测痛点：发布后才暴露打包/断言问题（`file` 缺失、静态链接无效、资产名不匹配…），
        # 结果同一个 tag 被重新 dispatch 了 3 次（每次 15–20 分钟）。
        # dry-run 会完整构建 + 打包 + 断言，但**不发布、不改资产**。
        description: "只构建与校验，不发布（发布前排雷用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 第一道护栏：tag 必须等于代码里的 OrzMCVersion.current，且落在 main 上。
  # 不一致的代价：客户端自升级用 releases/latest 的 tag 与二进制内嵌版本比较，
  # 版本对不上会变成「下载→替换→重启后版本没变→再提示升级」的死循环。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # dry-run 且未打 tag 时，构建/断言用源码版本拼出的 tag。
      tag: ${{ steps.tags.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Read the version from source
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*static let current = "\([^"]*\)".*/\1/p' Sources/Game/OrzMCVersion.swift | head -1)"
          if [ -z "$version" ]; then
            echo "::error::cannot read OrzMCVersion.current from Sources/Game/OrzMCVersion.swift"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag matches the version in source
        id: tags
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          # 正式发布必须显式给 tag（手工 dispatch 且未填时 github.ref_name 是分支名）。
          if [ "$DRY_RUN" != "true" ] && [ "${{ inputs.tag }}" = "" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::正式发布必须提供 tag 输入（如 -f tag=v0.16.0）"
            exit 1
          fi
          # dry-run 允许在**打 tag 之前**跑（发布前排雷），此时以源码版本为准。
          if [ "$DRY_RUN" = "true" ] && ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG="v$VERSION"
            echo "::notice::dry-run 且 $TAG 尚未打 tag，按源码版本 v$VERSION 校验"
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match v$VERSION (Sources/Game/OrzMCVersion.swift). Bump the version first, then tag."
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "ok: $TAG == v$VERSION"
      - name: Tag commit is on main
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 用 checkout 出来的 HEAD(手动 dispatch 时 github.ref 是分支,不能当 tag)。
          sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "::error::tag $TAG points at $sha which is not on main — release from main only."
            exit 1
          fi
          echo "ok: $sha is on main"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset: orzmc-macos-arm64
          # 交叉编译（`swift build --arch x86_64`）被 swift-openapi-generator 构建插件挡下：
          # 插件内部按 `ARCHS` 校验、`VALID_ARCHS` 仅 arm64 → 失败（实测 air）。
          # 故 x86_64 仍用 Intel runner；靠 SwiftPM 缓存把二次构建从 ~58min 拉低。
          - runner: macos-15-intel
            arch: x86_64
            asset: orzmc-macos-x86_64
    runs-on: ${{ matrix.runner }}
    # 只用标准 GitHub-hosted runner（`macos-15`/`macos-15-intel`）；
    # 勿改 `-large`/`-xlarge`（larger runner，即使 public 也计费）。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Toolchain
        run: swift --version
      - name: Restore SwiftPM cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-release-${{ matrix.asset }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-release-${{ matrix.asset }}-
      - name: Build (release)
        run: swift build -c release --product orzmc
      - name: Package the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --show-bin-path)"
          cp "$BIN/orzmc" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" version
      - name: Save SwiftPM cache
        # release 由 workflow_dispatch 在 main 上触发 → ref 为 main，可复用。
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Assert architecture
        shell: bash
        run: |
          set -euo pipefail
          info="$(file -b "${{ matrix.asset }}")"
          echo "$info"
          case "$info" in
            *"${{ matrix.arch }}"*) echo "ok: ${{ matrix.arch }}" ;;
            *) echo "::error::expected ${{ matrix.arch }}, got: $info"; exit 1 ;;
          esac
      - name: Assert the binary reports the released version
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          out="$(./${{ matrix.asset }} version)"
          case "$out" in
            "orzmc ${TAG#v}"*) echo "ok: $out" ;;
            *) echo "::error::binary reports '$out', expected 'orzmc ${TAG#v}'"; exit 1 ;;
          esac
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # Linux 产物（决策 D14：跨平台）。用官方 `swift:6.0` 容器构建，资产命名与
  # Python 侧 `asset_for()` 的 (os, arch) → asset 规则一致（`orzmc-linux-<arch>`）。
  build-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            file_arch: x86-64
            asset: orzmc-linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            file_arch: aarch64
            asset: orzmc-linux-arm64
    runs-on: ${{ matrix.runner }}
    container: swift:6.0
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        run: swift build -c release --product orzmc
      - name: Package the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --show-bin-path)"
          cp "$BIN/orzmc" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" version
      - name: Assert architecture
        shell: bash
        run: |
          set -euo pipefail
          # `swift:6.0` 精简镜像没有 `file`；容器里用 `uname -m` 断言「构建机架构」，
          # 再靠下面的 `./asset version` 证明产物能在本机执行（架构不符会直接 Exec format error）。
          machine="$(uname -m)"
          echo "runner arch: $machine (expect ${{ matrix.file_arch }})"
          case "$machine" in
            "${{ matrix.file_arch }}"|"${{ matrix.arch }}") echo "ok: ${{ matrix.arch }}" ;;
            *) echo "::error::expected ${{ matrix.arch }}, got runner $machine"; exit 1 ;;
          esac
      - name: Assert the binary reports the released version
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          out="$(./${{ matrix.asset }} version)"
          case "$out" in
            "orzmc ${TAG#v}"*) echo "ok: $out" ;;
            *) echo "::error::binary reports '$out', expected 'orzmc ${TAG#v}'"; exit 1 ;;
          esac
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # Windows 产物（D14 Phase 6.5）。前提同 `ci.yml` 的 `windows` job：
  # `windows-2022` + Swift 6.2 + `update-sdk-modules` + 开发者模式（详见 docs/windows-port.md）。
  # x64 与 **arm64** 两腿并行（Swift 6.2 起 swift.org 提供 Windows 10 arm64 工具链，
  # runner 用 `windows-11-arm`）；资产名与 `install.ps1` 的 `$env:PROCESSOR_ARCHITECTURE`
  # 映射一致：`orzmc-windows-<arch>.zip`。
  build-windows:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: amd64
            asset: orzmc-windows-x86_64.zip
          - runner: windows-11-arm
            arch: arm64
            asset: orzmc-windows-arm64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
          # amd64 / arm64：arm64 腿必须显式指定，否则装上 x64 工具链却在 arm64 上跑
          build_arch: ${{ matrix.arch }}
          update-sdk-modules: true
      - name: Enable Developer Mode (symlinks for build-tool plugins)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            -Name AllowDevelopmentWithoutDevLicense -PropertyType DWORD -Value 1 -Force | Out-Null

      # arm64 必须把 **MSVC 库**也换到 arm64：runner 默认是 x64，
      # 否则链接时报 `msvcrt.lib(...): machine type x64 conflicts with arm64`
      # （2026-10-19 探针实测）。x64 腿不需要，保持默认。
      - name: MSVC environment (arm64)
        if: matrix.arch == 'arm64'
        uses: ./.github/actions/msvc-arm64
      - name: Build (release)
        shell: pwsh
        run: |
          # 静态链接 Swift 运行时：用户机器通常没装 Swift，动态链接会 STATUS_DLL_NOT_FOUND。
          swift build -c release --product orzmc --static-swift-stdlib --only-use-versions-from-resolved-file
      - name: Package the binary + Swift runtime DLLs
        shell: pwsh
        run: |
          # Windows 的 Swift 程序运行时要 DLL（swiftCore/Foundation/swiftCRT/…），
          # `--static-swift-stdlib` 并不能把它们静态链进去（`dumpbin /dependents` 实测仍列出）。
          # 因此资产是 zip：exe + 运行时 DLL；install.ps1 解压到安装目录。
          $bin = (swift build -c release --show-bin-path)
          $runtime = (Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Runtimes\*\usr\bin" -Directory | Select-Object -Last 1).FullName
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$bin\orzmc.exe" dist\
          Copy-Item "$runtime\*.dll" dist\
          if (Test-Path ${{ matrix.asset }}) { Remove-Item -Force ${{ matrix.asset }} }
          Compress-Archive -Path "dist\*" -DestinationPath "${{ matrix.asset }}" -Force
          Write-Output ("zip: " + ((Get-Item "${{ matrix.asset }}").Length / 1MB) + " MB")

      - name: Assert the packaged binary runs on a clean PATH
        shell: pwsh
        run: |
          # 模拟「用户机器没装 Swift」：解压到临时目录 + 摘掉 PATH 里的 Swift 目录后再跑。
          Expand-Archive -Path "${{ matrix.asset }}" -DestinationPath verify -Force
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and $_ -notmatch 'Swift' }) -join ';'
          & ".\verify\orzmc.exe" --version | Select-Object -First 1
      - name: Assert the binary reports the released version
        shell: pwsh
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          $out = (& ".\verify\orzmc.exe" --version | Select-Object -First 1)
          $want = "orzmc $($env:TAG.TrimStart('v'))"
          if (-not $out.StartsWith($want)) { throw "binary reports '$out', expected '$want'" }
          Write-Output "ok: $out"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: orzmc-windows-${{ matrix.arch }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # 所有平台产物齐了才建/发布 Release：半成品不会出现在 releases/latest 上，
  # 一键安装与 `orzmc update` 也就不会提前把新版本推给用户。
  # 发布后验收（D14.1 第 1/4 条）：把**用户真正下载到的** Linux 资产拉下来，
  # 在干净容器里跑 CLI 行为验收 + 安装器全链路（安装 → 补全落盘 → 清单 → 卸载清理）。
  # 资产坏了这一步就红，而不是等用户踩。
  verify-linux:
    needs: publish
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 验收脚本只有一份，在父仓库（M2）。
      - name: Checkout parent (acceptance harness + spec)
        uses: actions/checkout@v4
        with:
          repository: OrzMC/OrzMC
          path: parent
          sparse-checkout: |
            docs/spec
            scripts/accept

      - name: Tooling
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates python3 zip >/dev/null

      - name: Download the published asset
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p dist
          curl -fsSL -o dist/orzmc-linux-x86_64 "${base}/orzmc-linux-x86_64"
          curl -fsSL -o dist/SHA256SUMS "${base}/SHA256SUMS"
          cd dist && sha256sum -c --ignore-missing SHA256SUMS

      - name: CLI acceptance on the released binary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/orzmc-linux-x86_64
          python3 parent/scripts/accept/cli.py --cli dist/orzmc-linux-x86_64

      - name: Installer end-to-end (install → verify → uninstall)
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export ORZMC_VERSION="$TAG"
          export SHELL=/bin/bash

          sh scripts/install.sh

          bin="$HOME/.local/bin/orzmc"
          completion="$HOME/.local/share/bash-completion/completions/orzmc"
          manifest="$HOME/.local/state/orzmc/install.conf"

          test -x "$bin" || { echo "::error::未安装二进制"; exit 1; }
          "$bin" --version | grep -q "orzmc ${TAG#v}" || { echo "::error::版本不符"; exit 1; }
          test -f "$completion" || { echo "::error::补全未落盘"; exit 1; }
          grep -q "^platform=linux-x86_64$" "$manifest" || { echo "::error::install.conf platform 不对"; cat "$manifest"; exit 1; }
          grep -q "^completion_file=" "$manifest" || { echo "::error::install.conf 未登记 completion_file"; cat "$manifest"; exit 1; }

          "$bin" uninstall --yes
          test ! -e "$bin" || { echo "::error::卸载后二进制仍在"; exit 1; }
          test ! -e "$completion" || { echo "::error::卸载后补全仍在"; exit 1; }
          echo "ok: install → verify → uninstall 全链路通过"

  publish:
    needs: [build, build-linux, build-windows]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum orzmc-macos-* orzmc-linux-* orzmc-windows-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # release-please 可能已建好 draft release(带整理过的 notes):补产物后发布。
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
          gh release view "$TAG" --json tagName,isDraft,url \
            --jq '"released \(.tagName) draft=\(.isDraft) \(.url)"'
